components:
  securitySchemes:
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: Account API token. Invalid or expired returns 401.
  parameters:
    token:
      name: token
      in: query
      required: true
      description: Account API token (use YOUR_TOKEN placeholder in examples).
      schema:
        type: string
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        response:
          type: object
          additionalProperties: true
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
    CampaignCreate:
      type: object
      required:
      - name
      - message_content
      properties:
        name:
          type: string
        message_content:
          type: string
          description: Message text; supports {{name}}.
