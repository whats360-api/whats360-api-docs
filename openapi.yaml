openapi: 3.0.3
info:
  title: whats360.live WhatsApp API (draft)
  version: 0.1.0
  description: 'Draft OpenAPI built from the official whats360.live developer reference.
    Not verified against production. Gaps: recipients body, per-endpoint response
    fields, campaign body beyond name and message_content. Never publish real tokens.'
  contact:
    name: whats360.live
    url: https://whats360.live
    email: info@whats360.live
externalDocs:
  description: whats360.live website
  url: https://whats360.live
