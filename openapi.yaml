    get:
      tags:
      - Messages
      summary: Send text message
      operationId: get_send_text
      parameters:
      - $ref: '#/components/parameters/token'
      - name: instance_id
        in: query
        required: true
        description: Device ID (a connected WhatsApp number).
        schema:
          type: string
      - name: jid
        in: query
        required: true
        description: WhatsApp chat ID, e.g. 201234567890@s.whatsapp.net.
        schema:
          type: string
      - name: msg
        in: query
        required: true
        description: Message text.
        schema:
          type: string
      responses:
        '200':
          description: Success envelope. Fields inside `response` are not documented
            per endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: 'Error. HTTP codes documented: 400, 401, 403, 404, 463 (WhatsApp
            restriction), 500.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
